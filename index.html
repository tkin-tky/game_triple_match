<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="どうぶつマッチ" />
    <meta name="theme-color" content="#ffd6e7" />
    <title>🌸 どうぶつマッチ 🌸</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ====== CUTE PASTEL THEME ====== */
      :root {
        --bg: #fff5fb;
        --bg2: #ffedf6;
        --panel: #ffffffcc;
        --panel2: #fff0f8;
        --border: #f5c6e0;
        --border2: #fbbad5;
        --text: #5a3060;
        --muted: #9b6aad;
        --accent1: #ff85b3;
        --accent2: #ffa0c8;
        --accent3: #c77dff;
        --green: #6edfc0;
        --yellow: #ffd166;
        --tile: 58px;
        --radius: 18px;
        --gap: 6px;
        --grid: 6;
        --tray: 7;
        --lift: 6px;
        --font:
          "Nunito", "Hiragino Maru Gothic Pro", "M PLUS Rounded 1c", rounded,
          sans-serif;
      }

      /* ====== RESET & BASE ====== */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        overscroll-behavior: none;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        overflow: hidden;
      }

      body {
        font-family: var(--font);
        color: var(--text);
        background:
          radial-gradient(
            ellipse 80% 60% at 20% 10%,
            #ffe0f0 0%,
            transparent 55%
          ),
          radial-gradient(
            ellipse 70% 50% at 80% 15%,
            #e8d5ff 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse 90% 60% at 50% 90%,
            #d5f0ff 0%,
            transparent 55%
          ),
          var(--bg);
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100dvh;
      }

      /* ====== FLOATING DECO CLOUDS (CSS only) ====== */
      body::before {
        content: "☁️";
        position: fixed;
        font-size: 60px;
        top: -10px;
        right: 10px;
        opacity: 0.18;
        animation: floatCloud 8s ease-in-out infinite alternate;
        pointer-events: none;
        z-index: 0;
      }
      body::after {
        content: "☁️";
        position: fixed;
        font-size: 40px;
        top: 30px;
        left: 5px;
        opacity: 0.12;
        animation: floatCloud 11s ease-in-out infinite alternate-reverse;
        pointer-events: none;
        z-index: 0;
      }
      @keyframes floatCloud {
        from {
          transform: translateX(0px) translateY(0px);
        }
        to {
          transform: translateX(12px) translateY(6px);
        }
      }

      /* ====== WRAP ====== */
      .wrap {
        width: min(520px, 100%);
        padding: calc(6px + env(safe-area-inset-top))
          calc(8px + env(safe-area-inset-right))
          calc(8px + env(safe-area-inset-bottom))
          calc(8px + env(safe-area-inset-left));
        display: flex;
        flex-direction: column;
        gap: 6px;
        position: relative;
        z-index: 1;
        overflow-y: auto;
        max-height: 100dvh;
        -webkit-overflow-scrolling: touch;
      }

      /* ====== HEADER ====== */
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        padding: 6px 4px 2px;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 900;
        color: var(--accent1);
        text-shadow:
          0 2px 0 rgba(255, 133, 179, 0.25),
          0 0 12px rgba(255, 133, 179, 0.15);
        letter-spacing: 0.5px;
        white-space: nowrap;
      }

      /* ====== PILL (score area) ====== */
      .pill {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        background: white;
        border: 2px solid var(--border);
        border-radius: 999px;
        padding: 5px 11px;
        font-size: 12px;
        font-weight: 800;
        color: var(--muted);
        box-shadow: 0 4px 14px rgba(255, 133, 179, 0.15);
      }
      .pill b {
        color: var(--text);
      }
      .pill-sep {
        color: var(--border2);
        font-weight: 400;
      }

      /* ====== BUTTONS ====== */
      .btns {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      button {
        font-family: var(--font);
        font-weight: 900;
        font-size: 13px;
        border: none;
        border-radius: 20px;
        padding: 8px 13px;
        cursor: pointer;
        transition:
          transform 0.12s,
          filter 0.12s;
        letter-spacing: 0.3px;
      }
      button:active {
        transform: scale(0.94);
      }

      .btn-primary {
        background: linear-gradient(135deg, #ff85b3, #ff5f9e);
        color: white;
        box-shadow:
          0 4px 14px rgba(255, 95, 158, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }
      .btn-secondary {
        background: linear-gradient(135deg, #ffe0f0, #ffc8e4);
        color: var(--accent1);
        box-shadow: 0 3px 10px rgba(255, 133, 179, 0.2);
      }
      button:hover {
        filter: brightness(1.07);
      }

      /* ====== BOARD CARD ====== */
      .board {
        background: var(--panel);
        border: 2px solid var(--border);
        border-radius: 26px;
        padding: 8px;
        box-shadow:
          0 8px 32px rgba(255, 133, 179, 0.12),
          inset 0 1px 0 rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(10px);
      }

      /* ====== HINT ====== */
      .hint {
        background: linear-gradient(135deg, #fff0f8, #ffeaf5);
        border: 1.5px solid var(--border);
        border-radius: 16px;
        padding: 8px 12px;
        font-size: 12px;
        line-height: 1.6;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .hint strong {
        color: var(--accent1);
      }

      /* ====== CONTROLS ====== */
      .controls {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        padding: 6px 10px;
        background: linear-gradient(135deg, #fff5fb, #fff0f8);
        border: 1.5px solid var(--border);
        border-radius: 16px;
        margin-bottom: 6px;
      }
      .controls .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .controls label {
        font-size: 12px;
        color: var(--muted);
        font-weight: 700;
      }

      select {
        font-family: var(--font);
        background: white;
        border: 2px solid var(--border2);
        color: var(--text);
        border-radius: 12px;
        padding: 5px 8px;
        font-weight: 800;
        font-size: 13px;
        cursor: pointer;
      }

      /* ====== TABLE (grid container) ====== */
      .table {
        border-radius: 20px;
        background:
          radial-gradient(
            ellipse 70% 50% at 30% 25%,
            rgba(255, 182, 229, 0.18),
            transparent 60%
          ),
          radial-gradient(
            ellipse 60% 50% at 70% 30%,
            rgba(200, 220, 255, 0.15),
            transparent 55%
          ),
          radial-gradient(
            ellipse 80% 60% at 45% 85%,
            rgba(180, 255, 220, 0.12),
            transparent 60%
          ),
          rgba(255, 250, 253, 0.85);
        border: 2px solid var(--border);
        padding: 8px;
        box-shadow:
          0 6px 24px rgba(255, 133, 179, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
        overflow: hidden;
        touch-action: manipulation;
        user-select: none;
        width: 100%;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(var(--grid), var(--tile));
        grid-template-rows: repeat(var(--grid), var(--tile));
        gap: var(--gap);
        justify-content: center;
        position: relative;
        z-index: 1;
        max-width: 100%;
        /* layerMid/layerBot のオフセット分の余白を確保 */
        padding-right: calc(var(--tile) * 0.32);
        padding-bottom: calc(var(--tile) * 0.32);
      }

      /* ====== CELLS ====== */
      .cell {
        width: var(--tile);
        height: var(--tile);
        border-radius: var(--radius);
        border: 2px dashed rgba(255, 182, 213, 0.38);
        background: rgba(255, 255, 255, 0.45);
        position: relative;
        overflow: visible;
      }
      .cell.hole {
        border: 2px dashed rgba(255, 182, 213, 0.15);
        background: rgba(255, 255, 255, 0.12);
      }

      /* ====== TILES ====== */
      .tile {
        position: absolute;
        width: var(--tile);
        height: var(--tile);
        border-radius: var(--radius);
        display: grid;
        place-items: center;
        border: 2px solid rgba(255, 255, 255, 0.65);
        box-shadow:
          0 5px 15px rgba(0, 0, 0, 0.1),
          inset 0 2px 0 rgba(255, 255, 255, 0.7),
          inset 0 -3px 0 rgba(0, 0, 0, 0.06);
        user-select: none;
        touch-action: manipulation;
        background:
          linear-gradient(
            160deg,
            rgba(255, 255, 255, 0.45) 0%,
            rgba(255, 255, 255, 0) 60%
          ),
          var(--c, #ffb3d4);
      }

      .tile .icon {
        font-size: calc(var(--tile) * 0.75);
        line-height: 1;
        transform-origin: center;
        transition: transform 0.1s;
      }

      /* Layer offsets */
      .tile.layerTop {
        left: 0;
        top: 0;
        z-index: 3;
        cursor: pointer;
      }
      .tile.layerMid {
        left: calc(var(--tile) * 0.16);
        top: calc(var(--tile) * 0.16);
        z-index: 2;
        opacity: 0.88;
        pointer-events: none;
        filter: brightness(0.95) saturate(0.9);
      }
      .tile.layerBot {
        left: calc(var(--tile) * 0.32);
        top: calc(var(--tile) * 0.32);
        z-index: 1;
        opacity: 0.78;
        pointer-events: none;
        filter: brightness(0.9) saturate(0.85);
      }

      /* Hover / active */
      .tile.layerTop {
        transition:
          transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1),
          filter 0.12s,
          box-shadow 0.12s;
      }
      .tile.layerTop:hover {
        transform: translateY(-3px) scale(1.1) rotate(-2deg);
        box-shadow:
          0 10px 24px rgba(0, 0, 0, 0.14),
          0 0 0 3px rgba(255, 133, 179, 0.4),
          0 0 16px rgba(255, 133, 179, 0.2),
          inset 0 2px 0 rgba(255, 255, 255, 0.75);
      }
      .tile.disabled {
        opacity: 0.5 !important;
        filter: grayscale(0.35) brightness(0.88);
        cursor: not-allowed;
      }

      /* ====== TRAY ====== */
      .trayWrap {
        margin-top: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .trayTitle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        font-weight: 800;
        color: var(--muted);
        padding: 0 2px;
      }

      .tray {
        display: grid;
        grid-template-columns: repeat(var(--tray), var(--tile));
        gap: var(--gap);
        justify-content: center;
        padding: 10px;
        border-radius: 18px;
        background:
          radial-gradient(
            ellipse 70% 60% at 50% 50%,
            rgba(255, 182, 229, 0.12),
            transparent 70%
          ),
          rgba(255, 255, 255, 0.75);
        border: 2px solid var(--border);
        min-height: calc(var(--tile) + 20px);
        box-shadow:
          0 4px 16px rgba(255, 133, 179, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      .slot {
        width: var(--tile);
        height: var(--tile);
        border-radius: var(--radius);
        border: 2px dashed rgba(255, 182, 213, 0.38);
        background: rgba(255, 255, 255, 0.4);
        position: relative;
        overflow: hidden;
      }
      .slot .tile {
        position: absolute;
        inset: 0;
        transform: none;
        cursor: default;
        width: 100%;
        height: 100%;
      }

      /* ====== TOAST ====== */
      .toast {
        min-height: 18px;
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
        text-align: center;
      }
      .toast.ok {
        color: #3dbf90;
      }
      .toast.bad {
        color: #ff6b6b;
      }

      /* ====== SIDE PANEL ====== */
      .side {
        background: var(--panel);
        border: 2px solid var(--border);
        border-radius: 22px;
        padding: 10px 12px;
        box-shadow: 0 6px 20px rgba(255, 133, 179, 0.1);
      }

      .legendGrid {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1.5px solid var(--border);
        background: white;
        border-radius: 999px;
        padding: 4px 9px;
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
      }
      .dot {
        width: 14px;
        height: 14px;
        border-radius: 6px;
        background: var(--c, #ffb3d4);
        border: 1.5px solid rgba(255, 255, 255, 0.7);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      }

      /* ====== LAYOUT ====== */
      .layout {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      @media (min-width: 900px) {
        .layout {
          flex-direction: row;
          align-items: flex-start;
        }
        .board {
          flex: 1.4;
        }
        .side {
          flex: 0.8;
        }
      }

      /* ====== TRAY RESPONSIVE ====== */
      @media (max-width: 480px) {
        .tray {
          grid-template-columns: repeat(var(--tray), minmax(0, 1fr));
          padding: 8px;
        }
        .slot {
          width: auto;
          height: auto;
          aspect-ratio: 1/1;
        }
        .slot .tile {
          width: 100%;
          height: 100%;
        }
      }

      /* ====== SOUND TOGGLE ====== */
      .soundToggle {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        font-weight: 800;
        color: var(--muted);
        user-select: none;
      }
      .switch {
        width: 42px;
        height: 24px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.1);
        border: 1.5px solid rgba(0, 0, 0, 0.08);
        position: relative;
        cursor: pointer;
        transition: background 0.18s;
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 18px;
        height: 18px;
        border-radius: 999px;
        background: white;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
        transition: transform 0.18s;
      }
      .switch.on {
        background: linear-gradient(135deg, #ff85b3, #ff5f9e);
        border-color: rgba(255, 95, 158, 0.4);
      }
      .switch.on::after {
        transform: translateX(18px);
      }

      /* ====== OVERLAY / MODAL ====== */
      .overlay {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        padding: 16px;
        background: rgba(80, 0, 40, 0.38);
        backdrop-filter: blur(6px);
        z-index: 1000;
      }
      .overlay.show {
        display: grid;
      }

      .modal {
        width: min(380px, 100%);
        background: linear-gradient(160deg, #fff5fb, #ffeaf5);
        border: 2.5px solid var(--border2);
        border-radius: 28px;
        padding: 22px 20px 18px;
        box-shadow:
          0 20px 60px rgba(200, 50, 120, 0.2),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
        text-align: center;
      }
      .modal h2 {
        margin: 0 0 10px;
        font-size: 26px;
        font-weight: 900;
        color: var(--accent1);
      }
      .modal p {
        margin: 0 0 16px;
        color: var(--muted);
        line-height: 1.65;
        font-size: 14px;
      }
      .modal .actions {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .modal-emoji {
        font-size: 48px;
        margin-bottom: 6px;
        display: block;
      }

      /* ====== ANIMATIONS ====== */
      @keyframes pop {
        0% {
          transform: scale(0.75);
        }
        55% {
          transform: scale(1.22);
        }
        100% {
          transform: scale(1);
        }
      }
      .popped {
        animation: pop 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      @keyframes burst {
        0% {
          transform: translate(-50%, -50%) scale(0.7);
          opacity: 0;
        }
        20% {
          opacity: 1;
        }
        100% {
          transform: translate(-50%, -50%) scale(1.5);
          opacity: 0;
        }
      }
      .burst {
        position: fixed;
        width: 10px;
        height: 10px;
        border-radius: 999px;
        pointer-events: none;
        animation: burst 0.55s ease-out forwards;
        z-index: 9999;
      }

      @keyframes sparkleUp {
        0% {
          transform: translate(-50%, -50%) scale(0.6);
          opacity: 0;
        }
        20% {
          opacity: 1;
        }
        100% {
          transform: translate(-50%, -110%) scale(1.2);
          opacity: 0;
        }
      }
      .sparkle {
        position: fixed;
        transform: translate(-50%, -50%);
        font-size: 20px;
        pointer-events: none;
        animation: sparkleUp 0.8s ease-out forwards;
        z-index: 9999;
      }

      @keyframes heartFloat {
        0% {
          transform: translate(-50%, -50%) scale(0.5) rotate(-10deg);
          opacity: 0;
        }
        30% {
          opacity: 1;
        }
        100% {
          transform: translate(-50%, -140%) scale(1.1) rotate(10deg);
          opacity: 0;
        }
      }
      .heartFloat {
        position: fixed;
        font-size: 18px;
        pointer-events: none;
        animation: heartFloat 0.9s ease-out forwards;
        z-index: 9999;
      }

      @keyframes tilePop {
        0% {
          transform: translateY(0) scale(1);
        }
        40% {
          transform: translateY(-6px) scale(1.15) rotate(-3deg);
        }
        100% {
          transform: translateY(0) scale(1);
        }
      }

      @keyframes wiggle {
        0%,
        100% {
          transform: rotate(0deg);
        }
        25% {
          transform: rotate(-6deg);
        }
        75% {
          transform: rotate(6deg);
        }
      }

      /* Star decoration */
      .star-deco {
        position: fixed;
        font-size: 14px;
        pointer-events: none;
        opacity: 0;
        animation: starDeco 1.2s ease-out forwards;
        z-index: 9999;
      }
      @keyframes starDeco {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0) rotate(0deg);
        }
        40% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1.3) rotate(180deg);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -120%) scale(0.5) rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .tile.layerTop:hover {
          transform: none;
        }
        .popped,
        .burst,
        .sparkle,
        .heartFloat,
        .star-deco {
          animation: none;
          opacity: 0;
        }
      }
    </style>

  <body>
    <div class="wrap">
      <header>
        <h1>🌸 どうぶつマッチ</h1>
        <div class="pill">
          <span>⭐<b id="score">0</b></span>
          <span class="pill-sep">·</span>
          <span>💫<b id="clears">0</b></span>
        </div>
        <div class="btns">
          <button class="btn-primary" id="newGame">🎮 New</button>
          <button class="btn-secondary" id="shuffle">🔀</button>
          <button class="btn-secondary" id="undo">↩️</button>
        </div>
      </header>

      <div class="layout">
        <section class="board">
          <div class="hint">
            💡 <strong>いちばん上のタイル</strong>だけ選べるよ！<br />
            <strong>おなじどうぶつが3つ</strong>そろうと自動で消えます✨
            トレイは最大 <strong>7つ</strong>まで。
          </div>

          <div class="controls">
            <div class="row">
              <label for="difficulty">難易度 🌟</label>
              <select id="difficulty">
                <option value="1" selected>やさしい</option>
                <option value="2">ふつう</option>
                <option value="3">むずかしい</option>
                <option value="4">超難しい</option>
                <option value="5">鬼</option>
              </select>
            </div>
            <div class="row">
              <div class="soundToggle" title="効果音 ON/OFF">
                <span>🎵</span>
                <div
                  id="soundSwitch"
                  class="switch on"
                  role="switch"
                  aria-checked="true"
                  tabindex="0"
                ></div>
                <span id="soundLabel">ON</span>
              </div>
            </div>
          </div>

          <!-- Tile counter -->
          <div
            style="
              display: flex;
              gap: 8px;
              justify-content: flex-end;
              padding: 2px 4px;
              font-size: 11px;
              font-weight: 700;
              color: var(--muted);
            "
          >
            <span
              >🐾 残り <b id="tilesRemain">0</b>/<b id="tilesTotal">0</b></span
            >
            <span>💖 消した <b id="tilesRemoved">0</b></span>
          </div>

          <div class="table">
            <div class="grid" id="grid" aria-label="grid"></div>
          </div>

          <div class="trayWrap">
            <div class="trayTitle">
              <span>🧺 トレイ</span>
              <span id="trayInfo">0 / 7</span>
            </div>

            <div class="toast" id="toast"></div>

        <aside class="side">
          <div class="hint">🐾 つかっているどうぶつ</div>
          <div class="legendGrid" id="legend"></div>
          <div class="hint" style="margin-top: 8px; font-size: 11px">
            ハイライトされたタイル＝今とれるよ！<br />
            かさなりタイルの数字＝残り枚数 📦
          </div>

    <!-- Game Over / Clear Overlay -->
    <div class="overlay" id="overlay">
      <div class="modal">
        <span class="modal-emoji" id="modalEmoji">🎉</span>
        <h2 id="overTitle">Game Over</h2>
        <p id="overText"></p>
        <div class="actions">
          <button class="btn-secondary" id="closeOver">とじる</button>
          <button class="btn-primary" id="restartOver">もういちど！</button>
        </div>
      </div>
    </div>

    <script>
      (() => {
        /* ===== Fit tile size to screen ===== */
        const rootStyle = document.documentElement.style;
        function fitToScreen() {
          const vw = Math.min(520, window.innerWidth || 375);
          // wrap padding: 8px*2, board padding: 8px*2, table padding: 8px*2, border: 2px*2 = 56px
          // grid right/bottom padding = tile*0.32 はタイルサイズ依存なので別途考慮
          const BOARD_PADDING = 60;
          const maxW = vw - BOARD_PADDING;

          const gap = 6;
          rootStyle.setProperty("--gap", gap + "px");

          const GRID = 6,
            TRAY = 7;
          // グリッドのpadding-right = tile*0.32 を考慮: tile*6 + gap*5 + tile*0.32 <= maxW
          // => tile*(6.32) + gap*5 <= maxW => tile <= (maxW - gap*5) / 6.32
          const tileGrid = Math.floor((maxW - gap * (GRID - 1)) / (GRID + 0.32));
          // トレイ幅: tile*7 + gap*6 <= maxW  =>  tile <= (maxW - gap*6) / 7
          const tileTray = Math.floor((maxW - gap * (TRAY - 1)) / TRAY);
          let tile = Math.min(tileGrid, tileTray);
          tile = Math.max(36, Math.min(68, tile));

          rootStyle.setProperty("--tile", tile + "px");
          rootStyle.setProperty(
            "--radius",
            Math.max(12, Math.min(20, Math.floor(tile * 0.28))) + "px",
          );
        }
        window.addEventListener("resize", fitToScreen, { passive: true });
        window.addEventListener(
          "orientationchange",
          () => setTimeout(fitToScreen, 150),
          { passive: true },
        );
        fitToScreen();

        /* ===== WebAudio SFX ===== */
        let audioCtx = null;
        let soundOn = true;
        const soundKey = "triple_match_sound_on_v2";
        try {
          const s = localStorage.getItem(soundKey);
          if (s !== null) soundOn = s === "1";
        } catch (e) {}

        function initAudio() {
          if (audioCtx) return;
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return;
          audioCtx = new Ctx();
        }

        function playTone({
          freq = 440,
          dur = 0.08,
          type = "sine",
          gain = 0.06,
          detune = 0,
          when = 0,
        }) {
          if (!soundOn) return;
          initAudio();
          if (!audioCtx) return;
          if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
          const t0 = audioCtx.currentTime + when;
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, t0);
          osc.detune.setValueAtTime(detune, t0);
          g.gain.setValueAtTime(0.0001, t0);
          g.gain.exponentialRampToValueAtTime(gain, t0 + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
          osc.connect(g);
          g.connect(audioCtx.destination);
          osc.start(t0);
          osc.stop(t0 + dur + 0.02);
        }

        function playSfx(name) {
          if (!soundOn) return;
          if (name === "pick") {
            playTone({ freq: 660, dur: 0.06, type: "sine", gain: 0.06 });
            playTone({
              freq: 880,
              dur: 0.05,
              type: "sine",
              gain: 0.04,
              when: 0.03,
            });
          } else if (name === "clear") {
            playTone({ freq: 784, dur: 0.07, type: "sine", gain: 0.06 });
            playTone({
              freq: 1047,
              dur: 0.07,
              type: "sine",
              gain: 0.05,
              when: 0.04,
            });
            playTone({
              freq: 1319,
              dur: 0.09,
              type: "sine",
              gain: 0.04,
              when: 0.08,
            });
          } else if (name === "combo") {
            playTone({ freq: 784, dur: 0.08, type: "triangle", gain: 0.055 });
            playTone({
              freq: 988,
              dur: 0.08,
              type: "triangle",
              gain: 0.05,
              when: 0.06,
            });
            playTone({
              freq: 1319,
              dur: 0.1,
              type: "triangle",
              gain: 0.045,
              when: 0.12,
            });
          } else if (name === "shuffle") {
            playTone({ freq: 440, dur: 0.09, type: "sine", gain: 0.04 });
            playTone({
              freq: 330,
              dur: 0.09,
              type: "sine",
              gain: 0.03,
              when: 0.06,
            });
          } else if (name === "undo") {
            playTone({ freq: 524, dur: 0.08, type: "sine", gain: 0.04 });
            playTone({
              freq: 440,
              dur: 0.09,
              type: "sine",
              gain: 0.03,
              when: 0.06,
            });
          } else if (name === "win") {
            [784, 988, 1175, 1568].forEach((f, i) =>
              playTone({
                freq: f,
                dur: 0.12,
                type: "sine",
                gain: 0.055,
                when: i * 0.1,
              }),
            );
          } else if (name === "lose") {
            playTone({ freq: 330, dur: 0.14, type: "sawtooth", gain: 0.05 });
            playTone({
              freq: 220,
              dur: 0.16,
              type: "sawtooth",
              gain: 0.045,
              when: 0.14,
            });
          } else if (name === "error") {
            playTone({ freq: 200, dur: 0.09, type: "square", gain: 0.05 });
            playTone({
              freq: 160,
              dur: 0.09,
              type: "square",
              gain: 0.05,
              when: 0.06,
            });
          }
        }

        /* ===== VFX ===== */
        const BURST_COLORS = [
          "#ff85b3",
          "#ffcce5",
          "#c77dff",
          "#ffe066",
          "#6edfc0",
          "#ffb3d4",
          "#ff9de2",
        ];

        function burstAt(x, y, n = 10) {
          for (let i = 0; i < n; i++) {
            const b = document.createElement("div");
            b.className = "burst";
            const ang = Math.random() * Math.PI * 2;
            const r = 8 + Math.random() * 20;
            b.style.left = x + Math.cos(ang) * r + "px";
            b.style.top = y + Math.sin(ang) * r + "px";
            b.style.background =
              BURST_COLORS[Math.floor(Math.random() * BURST_COLORS.length)];
            b.style.width = b.style.height = 6 + Math.random() * 8 + "px";
            b.style.boxShadow = `0 0 8px ${BURST_COLORS[0]}`;
            document.body.appendChild(b);
            setTimeout(() => b.remove(), 650);
          }
        }

        function sparkleAt(x, y, text = "✨") {
          const s = document.createElement("div");
          s.className = "sparkle";
          s.textContent = text;
          s.style.left = x + "px";
          s.style.top = y + "px";
          document.body.appendChild(s);
          setTimeout(() => s.remove(), 900);
        }

        function heartAt(x, y) {
          const hearts = ["💕", "💖", "🌸", "⭐", "💫", "🌟"];
          for (let i = 0; i < 3; i++) {
            setTimeout(() => {
              const h = document.createElement("div");
              h.className = "heartFloat";
              h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
              h.style.left = x + (Math.random() - 0.5) * 40 + "px";
              h.style.top = y + "px";
              document.body.appendChild(h);
              setTimeout(() => h.remove(), 1000);
            }, i * 80);
          }
        }

        function starDecoAt(x, y) {
          const decos = ["⭐", "✨", "💫", "🌟", "💖", "🎀"];
          for (let i = 0; i < 5; i++) {
            const d = document.createElement("div");
            d.className = "star-deco";
            d.textContent = decos[Math.floor(Math.random() * decos.length)];
            d.style.left = x + (Math.random() - 0.5) * 60 + "px";
            d.style.top = y + (Math.random() - 0.5) * 40 + "px";
            document.body.appendChild(d);
            setTimeout(() => d.remove(), 1300);
          }
        }

        /* ===== Sound switch ===== */
        const soundSwitch = document.getElementById("soundSwitch");
        const soundLabel = document.getElementById("soundLabel");

        function renderSoundUI() {
          if (!soundSwitch || !soundLabel) return;
          soundSwitch.classList.toggle("on", !!soundOn);
          soundSwitch.setAttribute("aria-checked", soundOn ? "true" : "false");
          soundLabel.textContent = soundOn ? "ON" : "OFF";
        }
        function toggleSound() {
          soundOn = !soundOn;
          try {
            localStorage.setItem(soundKey, soundOn ? "1" : "0");
          } catch (e) {}
          renderSoundUI();
          if (soundOn) playSfx("pick");
        }
        if (soundSwitch) {
          soundSwitch.addEventListener("click", toggleSound);
          soundSwitch.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              toggleSound();
            }
          });
          renderSoundUI();
        }

        window.addEventListener("pointerdown", () => initAudio(), {
          once: true,
        });
        const tableEl = document.querySelector(".table");
        if (tableEl)
          tableEl.addEventListener("touchmove", (e) => e.preventDefault(), {
            passive: false,
          });

        /* ===== Game constants ===== */
        const GRID_N = 6;
        const CELLS = GRID_N * GRID_N;
        const TRAY_MAX = 7;

        const MAX_TOTAL_TILES_BY_DIFFICULTY = {
          1: 45,
          2: 60,
          3: 75,
          4: 90,
          5: 108,
        };

        /* cute animal icons */
        const ICONS = [
          "🐶",
          "🐱",
          "🐭",
          "🐹",
          "🐰",
          "🦊",
          "🐻",
          "🐼",
          "🐨",
          "🐯",
          "🦁",
          "🐸",
          "🐷",
          "🐮",
          "🐵",
          "🐔",
          "🐧",
          "🦉",
          "🦄",
          "🐙",
          "🦀",
          "🐢",
          "🦖",
          "🦋",
        ];

        /* pastel tile colors */
        const COLORS = [
          "#ffb3d1",
          "#b8f0dd",
          "#ffe28a",
          "#c9b8ff",
          "#ffc4a3",
          "#a8e8ff",
          "#ffcce5",
          "#b8ffea",
          "#ffd98a",
          "#d4b8ff",
          "#ffb8a0",
          "#a8d8ff",
          "#ff9dcf",
          "#98e8cc",
          "#ffcd6a",
          "#bea8ff",
          "#ffa888",
          "#88d0ff",
          "#f7a8e8",
          "#a8f0d8",
          "#ffc55a",
          "#c8a8ff",
          "#ff9878",
          "#7ec8ff",
        ];

        const elGrid = document.getElementById("grid");
        const elTray = document.getElementById("tray");
        const elTrayInfo = document.getElementById("trayInfo");
        const elScore = document.getElementById("score");
        const elClears = document.getElementById("clears");
        const elBest = document.getElementById("best");
        const elToast = document.getElementById("toast");
        const overlay = document.getElementById("overlay");
        const overTitle = document.getElementById("overTitle");
        const overText = document.getElementById("overText");
        const overEmoji = document.getElementById("modalEmoji");
        const difficultySel = document.getElementById("difficulty");
        const elTilesRemain = document.getElementById("tilesRemain");
        const elTilesTotal = document.getElementById("tilesTotal");
        const elTilesRemoved = document.getElementById("tilesRemoved");

        const bestKeyPrefix = "triple_match_cute_best_v1_";
        function bestKey() {
          return bestKeyPrefix + Number(difficultySel.value);
        }

        function fmtTime(sec) {
          sec = Math.max(0, Math.floor(sec));
          return (
            String(Math.floor(sec / 60)).padStart(2, "0") +
            ":" +
            String(sec % 60).padStart(2, "0")
          );
        }

        function loadBest() {
          try {
            const raw = localStorage.getItem(bestKey());
            if (!raw) return null;
            const obj = JSON.parse(raw);
            if (typeof obj.moves === "number") return obj;
          } catch (e) {}
          return null;
        }
        function saveBest(obj) {
          try {
            localStorage.setItem(bestKey(), JSON.stringify(obj));
          } catch (e) {}
        }
        function renderBest() {
          const b = loadBest();
          if (elBest) elBest.textContent = b ? `${b.moves}手` : "-";
        }

        /* ===== Game state ===== */
        let holes = Array.from({ length: CELLS }, () => false);
        let activeIdx = [];
        let stacks = Array.from({ length: CELLS }, () => []);
        let tray = [];
        let score = 0,
          clears = 0,
          moves = 0;
        let startTimeMs = 0;
        let history = [];
        let initialTotalTiles = 0;
        let initialTypeTotals = new Map();

        function randInt(n) {
          return Math.floor(Math.random() * n);
        }
        function shuffleArr(a) {
          for (let i = a.length - 1; i > 0; i--) {
            const j = randInt(i + 1);
            [a[i], a[j]] = [a[j], a[i]];
          }
          return a;
        }

        function setToast(msg, cls = "") {
          elToast.className = "toast " + cls;
          elToast.textContent = msg || "";
        }

        function setScore(next) {
          score = next;
          elScore.textContent = String(score);
        }
        function setClears(next) {
          clears = next;
          elClears.textContent = String(clears);
        }

        function tileDisplay(type) {
          return {
            icon: ICONS[type] || "🐾",
            color: COLORS[type % COLORS.length],
          };
        }

        function recomputeActive() {
          activeIdx = [];
          for (let i = 0; i < CELLS; i++) if (!holes[i]) activeIdx.push(i);
        }

        function computeRemainingTiles() {
          let b = 0;
          for (const idx of activeIdx) b += stacks[idx].length;
          return b + tray.length;
        }

        function updateTileCounters() {
          const remain = computeRemainingTiles();
          const removed = Math.max(0, initialTotalTiles - remain);
          if (elTilesRemain) elTilesRemain.textContent = String(remain);
          if (elTilesTotal)
            elTilesTotal.textContent = String(initialTotalTiles);
          if (elTilesRemoved) elTilesRemoved.textContent = String(removed);
        }

        /* ===== Hole generation ===== */
        function generateHoles() {
          const d = Number(difficultySel.value);
          let holeTarget = [18, 15, 12, 6, 0][d - 1] ?? 12;
          holeTarget = Math.min(holeTarget, CELLS - 18);
          holeTarget = Math.max(0, holeTarget);

          holes = Array.from({ length: CELLS }, () => false);
          if (holeTarget === 0) {
            recomputeActive();
            return;
          }

          const cands = [...Array(CELLS).keys()];
          shuffleArr(cands);
          function nH(idx) {
            const r = Math.floor(idx / GRID_N),
              c = idx % GRID_N,
              nb = [
                [r - 1, c],
                [r + 1, c],
                [r, c - 1],
                [r, c + 1],
              ];
            return nb.reduce(
              (s, [rr, cc]) =>
                rr < 0 || cc < 0 || rr >= GRID_N || cc >= GRID_N
                  ? s
                  : s + (holes[rr * GRID_N + cc] ? 1 : 0),
              0,
            );
          }
          function score(idx) {
            const r = Math.floor(idx / GRID_N),
              c = idx % GRID_N;
            return (
              (r === 0 || c === 0 || r === GRID_N - 1 || c === GRID_N - 1
                ? 0.7
                : 0) +
              nH(idx) * 1.25 +
              Math.random() * 0.25
            );
          }
          let placed = 0;
          for (const idx of cands) {
            if (placed >= holeTarget) break;
            if (!holes[idx] && score(idx) < 1.65) {
              holes[idx] = true;
              placed++;
            }
          }
          if (placed < holeTarget) {
            const rest = cands.filter((i) => !holes[i]);
            shuffleArr(rest);
            for (const idx of rest) {
              if (placed >= holeTarget) break;
              holes[idx] = true;
              placed++;
            }
          }
          recomputeActive();
        }

        /* ===== Stack init ===== */
        function chooseTypesUsed(total) {
          const d = Number(difficultySel.value);
          let pref = [6, 9, 12, 18, 24][d - 1] ?? 12;
          pref = Math.min(pref, ICONS.length);
          for (let t = pref; t >= 6; t--) {
            if (total % t === 0 && (total / t) % 3 === 0) return t;
          }
          for (let t = Math.min(pref, ICONS.length); t >= 3; t--) {
            if (total % t === 0 && (total / t) % 3 === 0) return t;
          }
          return 0;
        }

        function makeBag(typesUsed, perType) {
          const bag = [];
          let id = 1;
          for (let t = 0; t < typesUsed; t++)
            for (let k = 0; k < perType; k++) bag.push({ id: id++, type: t });
          shuffleArr(bag);
          return bag;
        }

        function initStacks() {
          const MAX_ATTEMPTS = 30;

          function pickFeasibleConfig(activeCells) {
            const d = Number(difficultySel.value);
            const maxTotal = MAX_TOTAL_TILES_BY_DIFFICULTY[d] || 75;
            const maxH = Math.max(1, Math.floor(maxTotal / activeCells));
            for (let h = maxH; h >= 1; h--) {
              const total = activeCells * h,
                typesUsed = chooseTypesUsed(total);
              if (typesUsed > 0)
                return { h, total, typesUsed, perType: total / typesUsed };
            }
            return null;
          }

          function buildRandomStacks() {
            stacks = Array.from({ length: CELLS }, () => []);
            let cfg = pickFeasibleConfig(activeIdx.length);
            if (!cfg) {
              for (let extra = 1; extra <= 6; extra++) {
                const idx = activeIdx[randInt(activeIdx.length)];
                holes[idx] = true;
                recomputeActive();
                cfg = pickFeasibleConfig(activeIdx.length);
                if (cfg) break;
              }
            }
            if (!cfg)
              cfg = {
                h: 1,
                total: activeIdx.length,
                typesUsed: 3,
                perType: Math.floor(activeIdx.length / 3),
              };
            const { total, typesUsed, perType } = cfg;
            const bag = makeBag(typesUsed, perType);
            for (let i = 0; i < total; i++)
              stacks[activeIdx[i % activeIdx.length]].push(bag[i]);
            for (const idx of activeIdx) shuffleArr(stacks[idx]);
            renderLegend(typesUsed);
            return cfg.h;
          }

          function topTypeCounts(stLocal) {
            const counts = new Map();
            for (const idx of activeIdx) {
              const s = stLocal[idx];
              if (!s.length) continue;
              const t = s[s.length - 1].type;
              counts.set(t, (counts.get(t) || 0) + 1);
            }
            return counts;
          }
          function hasTopTriple(stLocal) {
            for (const v of topTypeCounts(stLocal).values())
              if (v >= 3) return true;
            return false;
          }

          function isSolvable() {
            const st = stacks.map((s) => s.map((t) => t.type));
            const memo = new Set();
            let nodes = 0;
            const NODE_LIMIT = 50000,
              IL = ICONS.length;

            function autoClear(tray) {
              const cnt = new Array(IL).fill(0);
              for (const t of tray) cnt[t]++;
              let ch = true;
              while (ch) {
                ch = false;
                for (let i = 0; i < IL; i++)
                  while (cnt[i] >= 3) {
                    cnt[i] -= 3;
                    ch = true;
                  }
              }
              const out = [];
              for (let i = 0; i < IL; i++)
                for (let k = 0; k < cnt[i]; k++) out.push(i);
              return out;
            }
            function keyOf(tray, stL) {
              const cnt = new Array(IL).fill(0);
              for (const t of tray) cnt[t]++;
              let tk = "";
              for (let i = 0; i < IL; i++)
                if (cnt[i]) tk += i + ":" + cnt[i] + ",";
              let tops = "";
              for (const idx of activeIdx) {
                const s = stL[idx],
                  n = s.length;
                tops += n ? String.fromCharCode(65 + s[n - 1]) : "x";
                tops += n.toString(36) + ".";
              }
              return tk + "|" + tops;
            }
            function dfs(tray, stL) {
              nodes++;
              if (nodes > NODE_LIMIT) return false;
              let rem = 0;
              for (const idx of activeIdx) rem += stL[idx].length;
              if (rem === 0) return autoClear(tray).length === 0;
              tray = autoClear(tray);
              if (tray.length > TRAY_MAX) return false;
              const key = keyOf(tray, stL);
              if (memo.has(key)) return false;
              memo.add(key);
              const tCnt = new Array(IL).fill(0);
              for (const t of tray) tCnt[t]++;
              const mv = [];
              for (const idx of activeIdx) {
                const s = stL[idx];
                if (!s.length) continue;
                const type = s[s.length - 1];
                const need = 3 - (tCnt[type] % 3);
                mv.push({
                  idx,
                  score:
                    (need === 1 ? 100 : need === 2 ? 50 : 10) +
                    (s.length <= 2 ? 5 : 0),
                });
              }
              mv.sort((a, b) => b.score - a.score);
              for (const m of mv) {
                const s = stL[m.idx],
                  type = s.pop(),
                  t2 = tray.slice();
                let ins = false;
                for (let i = 0; i < t2.length; i++) {
                  if (t2[i] === type) {
                    t2.splice(i + 1, 0, type);
                    ins = true;
                    break;
                  }
                }
                if (!ins) t2.push(type);
                if (t2.length <= TRAY_MAX && dfs(t2, stL)) return true;
                s.push(type);
              }
              return false;
            }
            return dfs([], st);
          }

          for (let attempt = 0; attempt < MAX_ATTEMPTS; attempt++) {
            buildRandomStacks();
            if (!hasTopTriple(stacks)) continue;
            if (isSolvable()) {
              setToast("", "");
              return;
            }
          }
          setToast("", "");
        }

        function renderLegend(typesUsed) {
          const el = document.getElementById("legend");
          el.innerHTML = "";
          for (let t = 0; t < typesUsed; t++) {
            const chip = document.createElement("div");
            chip.className = "chip";
            const dot = document.createElement("div");
            dot.className = "dot";
            dot.style.setProperty("--c", COLORS[t % COLORS.length]);
            const lbl = document.createElement("div");
            lbl.textContent = `${ICONS[t]}`;
            chip.appendChild(dot);
            chip.appendChild(lbl);
            el.appendChild(chip);
          }
        }

        /* ===== Snapshot / Undo ===== */
        function snapshot() {
          return {
            stacksCopy: stacks.map((s) => s.slice()),
            holesCopy: holes.slice(),
            trayBefore: tray.slice(),
            scoreBefore: score,
            clearsBefore: clears,
          };
        }
        function restoreSnap(snap) {
          stacks = snap.stacksCopy.map((s) => s.slice());
          holes = snap.holesCopy.slice();
          recomputeActive();
          tray = snap.trayBefore.slice();
          score = snap.scoreBefore;
          clears = snap.clearsBefore;
          setScore(score);
          setClears(clears);
          renderTray();
          renderGrid();
          updateTileCounters();
          overlay.classList.remove("show");
        }

        /* ===== ensureTopTriple ===== */
        function hasTopTriple(stLocal) {
          const counts = new Map();
          for (const idx of activeIdx) {
            const s = stLocal[idx];
            if (!s.length) continue;
            const t = s[s.length - 1].type;
            counts.set(t, (counts.get(t) || 0) + 1);
          }
          for (const v of counts.values()) if (v >= 3) return true;
          return false;
        }
        function reshuffleTopOnly() {
          const idxs = [],
            tops = [];
          for (const idx of activeIdx) {
            const s = stacks[idx];
            if (!s.length) continue;
            idxs.push(idx);
            tops.push(s[s.length - 1].type);
          }
          if (tops.length < 3) return false;
          shuffleArr(tops);
          for (let i = 0; i < idxs.length; i++)
            stacks[idxs[i]][stacks[idxs[i]].length - 1].type = tops[i];
          return true;
        }
        function reshuffleAllTiles() {
          const all = [],
            sizes = [];
          for (const idx of activeIdx) {
            sizes.push(stacks[idx].length);
            for (const t of stacks[idx]) all.push(t.type);
          }
          shuffleArr(all);
          let p = 0;
          for (let k = 0; k < activeIdx.length; k++) {
            const idx = activeIdx[k],
              sz = sizes[k];
            for (let j = 0; j < sz; j++) stacks[idx][j].type = all[p++];
            shuffleArr(stacks[idx]);
          }
        }
        function ensureTopTriple() {
          const MAX = 18;
          for (let t = 0; t < MAX; t++)
            if (hasTopTriple(stacks)) return true;
            else reshuffleTopOnly();
          reshuffleAllTiles();
          for (let t = 0; t < MAX; t++)
            if (hasTopTriple(stacks)) return true;
            else reshuffleTopOnly();
          return hasTopTriple(stacks);
        }

        /* ===== Render ===== */
        function renderGrid() {
          elGrid.innerHTML = "";
          const trayFull = tray.length >= TRAY_MAX;

          function makeTile(type, cls, clickable, onClick) {
            const d = tileDisplay(type);
            const el = document.createElement("div");
            el.className =
              "tile " + cls + (trayFull && clickable ? " disabled" : "");
            el.style.setProperty("--c", d.color);

            const icon = document.createElement("div");
            icon.className = "icon";
            icon.textContent = d.icon;
            el.appendChild(icon);

            if (clickable && !trayFull) {
              el.addEventListener("pointerdown", (ev) => {
                ev.preventDefault();
                ev.stopPropagation();
                el.classList.add("popped");
                setTimeout(() => el.classList.remove("popped"), 260);
                const r = el.getBoundingClientRect();
                sparkleAt(r.left + r.width / 2, r.top + r.height / 2, "✦");
                playSfx("pick");
                onClick(ev);
              });
            }
            return el;
          }

          for (let i = 0; i < CELLS; i++) {
            const cell = document.createElement("div");
            cell.className = "cell" + (holes[i] ? " hole" : "");
            if (holes[i]) {
              elGrid.appendChild(cell);
              continue;
            }

            const s = stacks[i];
            if (!s || s.length === 0) {
              elGrid.appendChild(cell);
              continue;
            }

            const top = s[s.length - 1];
            const mid = s.length > 1 ? s[s.length - 2] : null;
            const bot = s.length > 2 ? s[s.length - 3] : null;

            if (bot)
              cell.appendChild(makeTile(bot.type, "layerBot", false, null));
            if (mid)
              cell.appendChild(makeTile(mid.type, "layerMid", false, null));

            cell.appendChild(
              makeTile(top.type, "layerTop", true, () => {
                if (tray.length >= TRAY_MAX) {
                  playSfx("error");
                  setToast("🙅 トレイが満杯だよ！(7/7)", "bad");
                  return;
                }
                pick(i);
              }),
            );

            elGrid.appendChild(cell);
          }
        }

        function renderTray() {
          elTray.innerHTML = "";
          for (let i = 0; i < TRAY_MAX; i++) {
            const slot = document.createElement("div");
            slot.className = "slot";
            if (tray[i]) {
              const d = tileDisplay(tray[i].type);
              const el = document.createElement("div");
              el.className = "tile";
              el.style.setProperty("--c", d.color);
              const icon = document.createElement("div");
              icon.className = "icon";
              icon.textContent = d.icon;
              el.appendChild(icon);
              slot.appendChild(el);
            }
            elTray.appendChild(slot);
          }
          elTrayInfo.textContent = `${tray.length} / ${TRAY_MAX}`;
        }

        /* ===== Auto-clear ===== */
        function autoClearOnce() {
          const counts = new Map();
          for (const t of tray)
            counts.set(t.type, (counts.get(t.type) || 0) + 1);
          for (const [type, cnt] of counts.entries()) {
            if (cnt >= 3) {
              let removed = 0;
              const next = [];
              for (const t of tray) {
                if (t.type === type && removed < 3) removed++;
                else next.push(t);
              }
              tray = next;
              clears += 1;
              score += 30 + Math.max(0, TRAY_MAX - tray.length) * 2;
              setClears(clears);
              setScore(score);
              playSfx("clear");
              const trayRect = elTray.getBoundingClientRect();
              const cx = trayRect.left + trayRect.width / 2;
              const cy = trayRect.top + trayRect.height / 2;
              burstAt(cx, cy, 16);
              heartAt(cx, cy);
              sparkleAt(cx, cy, "🌸");
              setToast(`🎉 ${ICONS[type]} が3つ消えた！`, "ok");
              return true;
            }
          }
          return false;
        }

        /* ===== Pick ===== */
        function pick(cellIndex) {
          const s = stacks[cellIndex];
          const top = s.pop();
          if (!top) return;

          moves += 1;
          history.push(snapshot());
          if (history.length > 30) history.shift();

          let inserted = false;
          for (let i = 0; i < tray.length; i++) {
            if (tray[i].type === top.type) {
              tray.splice(i + 1, 0, top);
              inserted = true;
              break;
            }
          }
          if (!inserted) tray.push(top);
          score += 1;
          setScore(score);

          renderTray();
          renderGrid();

          let combo = 0;
          while (autoClearOnce()) {
            combo++;
            renderTray();
            renderGrid();
          }

          if (combo >= 2) {
            playSfx("combo");
            const trayRect = elTray.getBoundingClientRect();
            starDecoAt(
              trayRect.left + trayRect.width * 0.3,
              trayRect.top + trayRect.height / 2,
            );
            starDecoAt(
              trayRect.left + trayRect.width * 0.7,
              trayRect.top + trayRect.height / 2,
            );
            setToast(`🔥 コンボ x${combo}！すごい！`, "ok");
          }
          if (combo === 0) setToast("", "");

          updateTileCounters();
          checkEnd();
        }

        /* ===== Check End ===== */
        function checkEnd() {
          const remaining = stacks.reduce((a, s) => a + s.length, 0);

          if (remaining === 0) {
            let cleared = false;
            while (true) {
              const counts = new Map();
              for (const t of tray)
                counts.set(t.type, (counts.get(t.type) || 0) + 1);
              if (![...counts.values()].some((v) => v >= 3)) break;
              if (!autoClearOnce()) break;
              cleared = true;
              renderTray();
              renderGrid();
            }
            if (tray.length === 0) {
              overEmoji.textContent = "🎉";
              overTitle.textContent = "クリア！🌟";
              playSfx("win");
              const gRect = elGrid.getBoundingClientRect();
              burstAt(
                gRect.left + gRect.width / 2,
                gRect.top + gRect.height / 2,
                28,
              );
              starDecoAt(
                gRect.left + gRect.width / 2,
                gRect.top + gRect.height / 2,
              );
              const timeSec = (performance.now() - startTimeMs) / 1000;
              const cur = { moves, timeSec };
              const best = loadBest();
              const better =
                !best ||
                cur.moves < best.moves ||
                (cur.moves === best.moves && cur.timeSec < best.timeSec);
              if (better) saveBest(cur);
              renderBest();
              overText.textContent =
                `やったー！全部消した！🐾\nスコア: ${score} / ${moves}手 / ${fmtTime(timeSec)}` +
                (better ? "\n🏆 ベスト更新！" : "");
              try {
                const _gid =
                  new URLSearchParams(location.search).get("id") ||
                  "triple_match";
                localStorage.setItem(
                  "kn_pending_result",
                  JSON.stringify({
                    game: _gid,
                    score: clears,
                    difficulty: String(difficultySel.value),
                    ts: Date.now(),
                  }),
                );
              } catch (e) {}
              overlay.classList.add("show");
              return;
            }
            overEmoji.textContent = "😿";
            overTitle.textContent = "ゲームオーバー…";
            playSfx("lose");
            overText.textContent = `盤面が空になったけどトレイに残りがあって消せないよ…\nスコア: ${score}`;
            try {
              const _gid =
                new URLSearchParams(location.search).get("id") ||
                "triple_match";
              localStorage.setItem(
                "kn_pending_result",
                JSON.stringify({
                  game: _gid,
                  score: clears,
                  difficulty: String(difficultySel.value),
                  ts: Date.now(),
                }),
              );
            } catch (e) {}
            overlay.classList.add("show");
            return;
          }

          if (tray.length >= TRAY_MAX) {
            const counts = new Map();
            for (const t of tray)
              counts.set(t.type, (counts.get(t.type) || 0) + 1);
            if (![...counts.values()].some((v) => v >= 3)) {
              overEmoji.textContent = "😢";
              overTitle.textContent = "ゲームオーバー…";
              overText.textContent = `トレイが満杯で消せないよ…\nスコア: ${score}`;
              try {
                const _gid =
                  new URLSearchParams(location.search).get("id") ||
                  "triple_match";
                localStorage.setItem(
                  "kn_pending_result",
                  JSON.stringify({
                    game: _gid,
                    score: clears,
                    difficulty: String(difficultySel.value),
                    ts: Date.now(),
                  }),
                );
              } catch (e) {}
              overlay.classList.add("show");
            }
          }
        }

        /* ===== Shuffle ===== */
        function shuffleWithHoles() {
          const all = [],
            sizes = [];
          for (const idx of activeIdx) {
            sizes.push(stacks[idx].length);
            for (const tile of stacks[idx]) all.push(tile.type);
          }
          shuffleArr(all);
          let p = 0;
          for (let k = 0; k < activeIdx.length; k++) {
            const idx = activeIdx[k],
              sz = sizes[k];
            for (let j = 0; j < sz; j++) stacks[idx][j].type = all[p++];
            shuffleArr(stacks[idx]);
          }
          renderGrid();
          playSfx("shuffle");
          setToast("🔀 シャッフルしたよ！", "");
          updateTileCounters();
          checkEnd();
        }

        function undo() {
          const snap = history.pop();
          if (!snap) {
            setToast("↩️ もう戻せないよ！", "bad");
            return;
          }
          restoreSnap(snap);
          playSfx("undo");
          setToast("↩️ 1手もどしたよ！", "");
        }

        /* ===== New game ===== */
        function startNew() {
          overlay.classList.remove("show");
          history = [];
          tray = [];
          setScore(0);
          setClears(0);
          moves = 0;
          startTimeMs = performance.now();
          renderBest();
          generateHoles();
          initStacks();
          ensureTopTriple();

          initialTypeTotals = new Map();
          for (const idx of activeIdx)
            for (const tile of stacks[idx])
              initialTypeTotals.set(
                tile.type,
                (initialTypeTotals.get(tile.type) || 0) + 1,
              );
          initialTotalTiles = 0;
          for (const v of initialTypeTotals.values()) initialTotalTiles += v;

          renderTray();
          renderGrid();
          updateTileCounters();
        }

        /* ===== Event bindings ===== */
        document.getElementById("newGame").addEventListener("click", startNew);
        document.getElementById("shuffle").addEventListener("click", () => {
          history.push(snapshot());
          shuffleWithHoles();
        });
        document.getElementById("undo").addEventListener("click", undo);
        document
          .getElementById("closeOver")
          .addEventListener("click", () => overlay.classList.remove("show"));
        document
          .getElementById("restartOver")
          .addEventListener("click", startNew);
        difficultySel.addEventListener("change", () => startNew());

        renderBest();
        startNew();

        function _saveProgressTM() {
          if (clears <= 0) return;
          try {
            const _gid =
              new URLSearchParams(location.search).get("id") || "triple_match";
            localStorage.setItem(
              "kn_pending_result",
              JSON.stringify({
                game: _gid,
                score: clears,
                difficulty: String(difficultySel.value),
                ts: Date.now(),
              }),
            );
          } catch (e) {}
        }
        window.addEventListener("pagehide", _saveProgressTM);
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "hidden") _saveProgressTM();
        });
      })();
    </script>
  </body>
